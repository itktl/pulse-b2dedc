<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Portfolio Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, a period switch, five ruled rows like a quote board, the chart under them */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --fg: #15201c; --muted: #66736d; --line: #dde3e0;
  --accent: #0f7b5f; --up: #0f7b5f; --down: #c2412d;
  --c-account: #0f7b5f; --c-sh: #2f5fd0; --c-bh: #b7791f; --c-spy: #8a948f; --c-qqq: #b9c0bc; --c-mk: #7b4bb7;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1311; --surface: #141c19; --fg: #e6ece9; --muted: #8b9893; --line: #24302b;
  --accent: #3ccf9f; --up: #3ccf9f; --down: #ff7a63;
  --c-account: #3ccf9f; --c-sh: #7aa2ff; --c-bh: #f0b54a; --c-spy: #7d8a84; --c-qqq: #4d5954; --c-mk: #b993f0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #141c19; --fg: #e6ece9; --muted: #8b9893; --line: #24302b;
  --accent: #3ccf9f; --up: #3ccf9f; --down: #ff7a63;
  --c-account: #3ccf9f; --c-sh: #7aa2ff; --c-bh: #f0b54a; --c-spy: #7d8a84; --c-qqq: #4d5954; --c-mk: #b993f0;
  color-scheme: dark; }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: grid; gap: 18px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.state { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.state.open .dot { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 22%, transparent); }
.periods { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.periods button { font: 500 13px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 7px; padding: 8px 0; cursor: pointer; }
.periods button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.periods button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
#board .row { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
#board .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#board .row.off .name, #board .row.off .val { opacity: 0.4; }
#board .row.off .swatch { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 2px; }
.name { font-weight: 500; min-width: 0; }
.sub { display: block; font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
.val { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; letter-spacing: -0.02em; }
.val.up { color: var(--up); } .val.down { color: var(--down); } .val.none { color: var(--muted); font-size: 16px; }
.row.you { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.row.you .val { font-size: 26px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font: 10px var(--mono); }
.foot { font: 12px/1.5 var(--mono); color: var(--muted); display: grid; gap: 2px; }
.warn { color: var(--down); }
.bal .row { grid-template-columns: 1fr auto; }
.bal form { display: flex; gap: 8px; margin-top: 8px; }
.bal input { flex: 1; min-width: 0; font: 15px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.bal input:focus-visible, .bal button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bal button { font: 500 13px var(--sans); color: var(--bg); background: var(--fg); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.bal .lock { font: 12px var(--mono); color: var(--muted); background: none; padding: 0; margin-left: 8px; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .val { transition: color .2s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Portfolio Pulse</h1>
    <span class="state" id="state"><span class="dot"></span><span id="stateText">loading</span></span>
  </header>
  <nav class="periods" id="periods" aria-label="Period">
    <button data-p="day">Today</button>
    <button data-p="1m">1M</button>
    <button data-p="ytd">YTD</button>
    <button data-p="1y">1Y</button>
    <button data-p="plan">Plan</button>
  </nav>
  <section class="board bal" id="bal" aria-live="polite" hidden></section>
  <section class="board" id="board" aria-live="polite"></section>
  <section class="chart"><svg id="chart" viewBox="0 0 360 200" role="img" aria-label="Growth over the period"></svg></section>
  <footer class="foot" id="foot"></footer>
</main>
<script>
const COLORS = { account: "--c-account", spyHunter: "--c-sh", bargainHunter: "--c-bh", spy: "--c-spy", qqq: "--c-qqq", makarios: "--c-mk" };
let data = null;
// LINES SHOWN ON THE CHART: tap a row to hide or show its line; remembered on this device only
let hidden = (() => { try { return new Set(JSON.parse(localStorage.getItem("pulse.hidden") || "[]")); } catch { return new Set(); } })();
function toggle(key) {
  hidden.has(key) ? hidden.delete(key) : hidden.add(key);
  try { localStorage.setItem("pulse.hidden", JSON.stringify([...hidden])); } catch {}
  render();
}
let period = (() => { try { return localStorage.getItem("pulse.period") || "day"; } catch { return "day"; } })();

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtDate = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });

function startDate(p, last) {
  const d = new Date(last + "T12:00:00Z");
  if (p === "1m") { d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0, 10); }
  if (p === "1y") { d.setUTCFullYear(d.getUTCFullYear() - 1); return d.toISOString().slice(0, 10); }
  if (p === "ytd") return (d.getUTCFullYear() - 1) + "-12-31";
  if (p === "plan") return data.planStart;
  return null;
}
// the base is the last close on or before the start; null if the line does not reach back that far
function window_(series, p) {
  const last = series[series.length - 1];
  if (p === "day") return series.length > 1 ? series.slice(-2) : null;
  const s = startDate(p, last[0]);
  let i = -1;
  for (let k = 0; k < series.length; k++) { if (series[k][0] <= s) i = k; else break; }
  return i < 0 ? null : series.slice(i);
}
const pct = (x) => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(Math.abs(x) < 0.1 ? 2 : 1) + "%";

function render() {
  if (!data) return;
  document.querySelectorAll("#periods button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === period)));
  const board = document.getElementById("board");
  board.textContent = "";
  const wins = {};
  for (const line of data.lines) {
    const w = window_(line.series, period);
    wins[line.key] = w;
    const row = document.createElement("div");
    row.className = "row" + (line.key === "account" ? " you" : "");
    const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = `var(${COLORS[line.key]})`;
    const name = document.createElement("span"); name.className = "name"; name.textContent = line.name;
    const sub = document.createElement("span"); sub.className = "sub";
    const val = document.createElement("span"); val.className = "val";
    if (w && w.length > 1) {
      const r = w[w.length - 1][1] / w[0][1] - 1;
      val.textContent = pct(r); val.classList.add(r >= 0 ? "up" : "down");
      sub.textContent = "since " + fmtDate(w[0][0]);
    } else if (w && w.length === 1) {
      val.textContent = "0.0%"; val.classList.add("none"); sub.textContent = "starts after " + fmtDate(w[0][0]);
    } else {
      val.textContent = "n/a"; val.classList.add("none"); sub.textContent = "no record that far back";
    }
    name.appendChild(sub);
    row.append(sw, name, val);
    const off = hidden.has(line.key);
    row.classList.toggle("off", off);
    row.tabIndex = 0; row.setAttribute("role", "button"); row.setAttribute("aria-pressed", String(!off));
    row.title = (off ? "Show " : "Hide ") + line.name + " on the chart";
    row.addEventListener("click", () => toggle(line.key));
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(line.key); } });
    board.appendChild(row);
  }
  drawChart(wins);
  foot();
}

function drawChart(wins) {
  const svg = document.getElementById("chart");
  const W = 360, H = 200, L = 6, R = 44, T = 8, B = 20;
  const keys = data.lines.map((l) => l.key).filter((k) => !hidden.has(k) && wins[k] && wins[k].length > 1);
  if (!keys.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">nothing to chart yet</text>`; return; }
  const dates = [...new Set(keys.flatMap((k) => wins[k].map((p) => p[0])))].sort();
  const x = (d) => L + (dates.indexOf(d) / Math.max(1, dates.length - 1)) * (W - L - R);
  const rel = {};
  let lo = 0, hi = 0;
  for (const k of keys) { const b = wins[k][0][1]; rel[k] = wins[k].map(([d, v]) => [d, v / b - 1]); for (const [, r] of rel[k]) { lo = Math.min(lo, r); hi = Math.max(hi, r); } }
  const pad = (hi - lo) * 0.08 || 0.01; lo -= pad; hi += pad;
  const y = (r) => T + (1 - (r - lo) / (hi - lo)) * (H - T - B);
  const step = niceStep((hi - lo) / 4);
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${css("--line")}" stroke-width="${Math.abs(v) < 1e-9 ? 1.2 : 0.6}"/>`;
    g += `<text x="${W - R + 6}" y="${(+yy + 3).toFixed(1)}">${(v * 100).toFixed(step < 0.01 ? 1 : 0)}%</text>`;
  }
  g += `<text x="${L}" y="${H - 5}">${fmtDate(dates[0])}</text><text x="${W - R}" y="${H - 5}" text-anchor="end">${fmtDate(dates[dates.length - 1])}</text>`;
  for (const k of [...keys].reverse()) {
    const pts = rel[k].map(([d, r]) => `${x(d).toFixed(1)},${y(r).toFixed(1)}`).join(" ");
    const wide = k === "account" ? 2.4 : k === "spy" || k === "qqq" ? 1.2 : 1.8;
    g += `<polyline points="${pts}" fill="none" stroke="${css(COLORS[k])}" stroke-width="${wide}" stroke-linejoin="round" stroke-linecap="round"${k === "qqq" ? ' stroke-dasharray="3 3"' : ""}/>`;
    const [ld, lr] = rel[k][rel[k].length - 1];
    g += `<circle cx="${x(ld).toFixed(1)}" cy="${y(lr).toFixed(1)}" r="${k === "account" ? 3 : 2.2}" fill="${css(COLORS[k])}"/>`;
  }
  svg.innerHTML = g;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }

function foot() {
  const el = document.getElementById("foot");
  const pt = new Date(data.priceTime);
  const ageMin = (Date.now() - pt.getTime()) / 60000;
  const open = ageMin < 20;
  document.getElementById("state").classList.toggle("open", open);
  document.getElementById("stateText").textContent = open ? "live" : "market closed";
  const ny = pt.toLocaleString(undefined, { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
  const synced = data.plannerSyncedAt ? new Date(data.plannerSyncedAt) : null;
  const syncedDays = synced ? (Date.now() - synced.getTime()) / 864e5 : Infinity;
  const lines = [
    `Prices as of ${ny} New York · checked ${new Date(data.updatedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`,
    `Holdings: account ${fmtDate(data.holdingsOn.account)} · Bargain Hunter ${fmtDate(data.holdingsOn.bargainHunter)} · SPY HUNTER ${fmtDate(data.holdingsOn.spyHunter)}` + (data.holdingsOn.makarios ? ` · Makarios ${fmtDate(data.holdingsOn.makarios)} (Schwab statement)` : ""),
  ];
  el.textContent = "";
  for (const t of lines) { const d = document.createElement("div"); d.textContent = t; el.appendChild(d); }
  const s = document.createElement("div");
  s.textContent = synced ? `Planner last synced ${synced.toLocaleDateString(undefined, { day: "numeric", month: "short" })}` + (syncedDays > 35 ? " — open the planner so new holdings reach this page" : "") : "";
  if (syncedDays > 35) s.className = "warn";
  el.appendChild(s);
  // the strategy lines come from the Mac mini daily; say so, and say loudly when it has stopped or a book is overdue
  const ss = data.strategiesSyncedAt ? new Date(data.strategiesSyncedAt) : null;
  if (ss) {
    const days = (Date.now() - ss.getTime()) / 864e5;
    const m = document.createElement("div");
    m.textContent = `Strategies updated by the Mac mini ${ss.toLocaleDateString(undefined, { day: "numeric", month: "short" })}` + (days > 4 ? " — the mini has stopped updating them" : "");
    if (days > 4) m.className = "warn";
    el.appendChild(m);
  }
  for (const t of data.overdue || []) { const w = document.createElement("div"); w.className = "warn"; w.textContent = t; el.appendChild(w); }
}

// THE LIVE BALANCE: published encrypted (balance.enc: OpenSSL "enc -pbkdf2" format, AES-256-CBC, key and IV from
// PBKDF2-SHA256 over the owner's passcode). Unlocked here with Web Crypto; the passcode stays on this device only.
const PASSKEY = "pulse.pass";
let balEnc = null, bal = null, balFor = null, balErr = "";
const getPass = () => { try { return localStorage.getItem(PASSKEY); } catch { return null; } };
const usd = (x) => x == null ? "–" : "US$" + Number(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
async function unlock(enc, pass) {
  const raw = Uint8Array.from(atob(enc.data), (c) => c.charCodeAt(0));
  if (new TextDecoder().decode(raw.slice(0, 8)) !== "Salted__") throw new Error("format");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: raw.slice(8, 16), iterations: enc.iter, hash: "SHA-256" }, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, raw.slice(16));
  const b = JSON.parse(new TextDecoder().decode(plain));
  if (b.pulse !== "balance") throw new Error("wrong");
  return b;
}
function renderBal() {
  const el = document.getElementById("bal");
  if (!balEnc) { el.hidden = true; return; }
  el.hidden = false; el.textContent = "";
  const row = document.createElement("div"); row.className = "row you";
  const name = document.createElement("span"); name.className = "name"; name.textContent = "Account balance";
  const sub = document.createElement("span"); sub.className = "sub";
  const val = document.createElement("span"); val.className = "val";
  if (bal) {
    val.textContent = usd(bal.net_liq);
    sub.textContent = "cash " + usd(bal.cash) + " · as of " + (bal.at_nz || "?").replace(/^\d{4}-/, "").replace(/ NZ[SD]T$/, " NZ") + (bal.stale ? " · STALE" : "");
    if (bal.stale) sub.className = "sub warn";
    const lk = document.createElement("button"); lk.className = "lock"; lk.type = "button"; lk.textContent = "lock";
    lk.addEventListener("click", () => { try { localStorage.removeItem(PASSKEY); } catch {} bal = null; balFor = null; renderBal(); });
    sub.appendChild(lk);
    name.appendChild(sub);
  } else {
    val.className = "val none"; val.textContent = "locked";
    const f = document.createElement("form");
    const i = document.createElement("input"); i.type = "password"; i.autocomplete = "current-password"; i.placeholder = "Passcode"; i.setAttribute("aria-label", "Passcode");
    const b = document.createElement("button"); b.type = "submit"; b.textContent = "Unlock";
    f.append(i, b);
    f.addEventListener("submit", async (e) => {
      e.preventDefault(); b.disabled = true; b.textContent = "…";
      try { bal = await unlock(balEnc, i.value); balFor = balEnc.data; balErr = ""; try { localStorage.setItem(PASSKEY, i.value); } catch {} }
      catch { balErr = "Wrong passcode"; }
      renderBal();
    });
    if (balErr) { sub.className = "sub warn"; sub.textContent = balErr; name.appendChild(sub); }
    name.appendChild(f);
  }
  row.append(name, val); el.appendChild(row);
}
async function loadBal() {
  try {
    const r = await fetch("balance.enc?t=" + Date.now(), { cache: "no-store" });
    balEnc = r.ok ? await r.json() : null;
  } catch { /* offline: keep what is shown */ }
  const pass = getPass();
  if (balEnc && pass && balFor !== balEnc.data) {
    try { bal = await unlock(balEnc, pass); balFor = balEnc.data; balErr = ""; }
    catch { bal = null; balFor = null; balErr = "Passcode changed: unlock again"; try { localStorage.removeItem(PASSKEY); } catch {} }
  }
  renderBal();
}

async function load() {
  loadBal();
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  } catch (e) {
    document.getElementById("stateText").textContent = data ? "offline · showing last" : "could not load";
  }
}
document.getElementById("periods").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  period = b.dataset.p; try { localStorage.setItem("pulse.period", period); } catch {}
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, 5 * 60 * 1000);
load();
</script>
</body>
</html>
